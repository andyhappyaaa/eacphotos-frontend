<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图库 - EAC Photo</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/dark.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <a href="/" class="nav-logo">
                    <img id="nav-logo" src="https://r2.eacof.org/logo-light.png" alt="EAC Photo">
                </a>
                <div class="nav-menu">
                    <a href="/" class="nav-link" data-i18n="nav.home">首页</a>
                    <a href="/gallery.html" class="nav-link active" data-i18n="nav.gallery">图库</a>
                    <a href="/upload.html" class="nav-link" data-i18n="nav.upload">上传</a>
                    <a href="/search.html" class="nav-link" data-i18n="nav.search">搜索</a>
                </div>
                <div class="nav-actions">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <select id="lang-select" class="lang-select">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                    <div id="auth-buttons" class="auth-buttons">
                        <a href="/login.html" class="btn btn-outline" data-i18n="nav.login">登录</a>
                        <a href="/register.html" class="btn btn-primary" data-i18n="nav.register">注册</a>
                    </div>
                </div>
            </div>
        </nav>

        <main>
            <div class="container">
                <div class="gallery-page">
                    <div class="gallery-header">
                        <h1 data-i18n="gallery.title">图库</h1>
                        <p data-i18n="gallery.subtitle">浏览社区所有航空摄影作品</p>
                    </div>

                    <div class="gallery-filters">
                        <div class="filter-tabs">
                            <button class="filter-tab active" data-filter="all" data-i18n="gallery.filter.all">全部</button>
                            <button class="filter-tab" data-filter="special" data-i18n="gallery.filter.special">特殊涂装</button>
                            <button class="filter-tab" data-filter="artistic" data-i18n="gallery.filter.artistic">风格图</button>
                            <button class="filter-tab" data-filter="military" data-i18n="gallery.filter.military">军用机</button>
                            <button class="filter-tab" data-filter="night" data-i18n="gallery.filter.night">夜拍</button>
                        </div>
                        <div class="gallery-sort">
                            <select id="gallery-sort" class="sort-select">
                                <option value="latest" data-i18n="search.sort.latest">最新上传</option>
                                <option value="popular" data-i18n="search.sort.popular">最受欢迎</option>
                                <option value="random" data-i18n="search.sort.random">随机</option>
                            </select>
                        </div>
                    </div>

                    <div class="photo-grid" id="gallery-grid">
                        <div class="skeleton" style="height: 300px; aspect-ratio: 16/9;"></div>
                        <div class="skeleton" style="height: 300px; aspect-ratio: 16/9;"></div>
                        <div class="skeleton" style="height: 300px; aspect-ratio: 16/9;"></div>
                        <div class="skeleton" style="height: 300px; aspect-ratio: 16/9;"></div>
                    </div>

                    <div class="pagination" id="gallery-pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="photo-modal" class="modal photo-modal">
        <div class="modal-content photo-modal-content">
            <button class="modal-close">&times;</button>
            <div class="photo-modal-body">
                <div class="photo-modal-image">
                    <img src="" alt="" id="modal-photo">
                </div>
                <div class="photo-modal-info">
                    <h2 id="modal-title"></h2>
                    <div class="photo-meta">
                        <div class="meta-item">
                            <span class="meta-label" data-i18n="upload.date">拍摄日期</span>
                            <span id="modal-date"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label" data-i18n="upload.registration">注册号</span>
                            <span id="modal-registration"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label" data-i18n="upload.aircraftType">机型</span>
                            <span id="modal-aircraft"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label" data-i18n="upload.airline">航司/运营人</span>
                            <span id="modal-airline"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label" data-i18n="upload.location">拍摄地点</span>
                            <span id="modal-location"></span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label" data-i18n="gallery.photographer">摄影师</span>
                            <a href="#" id="modal-photographer"></a>
                        </div>
                    </div>
                    <div class="photo-description">
                        <h3 data-i18n="upload.description">图片描述</h3>
                        <p id="modal-description"></p>
                    </div>
                    <div class="photo-tags" id="modal-tags"></div>
                    <div class="photo-actions">
                        <button class="btn btn-outline" id="modal-like">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                            <span id="modal-like-count">0</span>
                        </button>
                        <button class="btn btn-outline" id="modal-download">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            <span data-i18n="gallery.download">下载</span>
                        </button>
                        <button class="btn btn-outline" id="modal-share">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="18" cy="5" r="3"/>
                                <circle cx="6" cy="12" r="3"/>
                                <circle cx="18" cy="19" r="3"/>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                            </svg>
                            <span data-i18n="gallery.share">分享</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/gallery.js"></script>
</body>
</html>
