<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索 - EAC Photo</title>
    <link rel="stylesheet" href=/src/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/dark.css">
    <link rel="stylesheet" href="/css/search.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <a href="/" class="nav-logo">
                    <img id="nav-logo" src="https://r2.eacof.org/logo-light.png" alt="EAC Photo">
                </a>
                <div class="nav-menu">
                    <a href="/" class="nav-link" data-i18n="nav.home">首页</a>
                    <a href="/gallery.html" class="nav-link" data-i18n="nav.gallery">图库</a>
                    <a href="/upload.html" class="nav-link" data-i18n="nav.upload">上传</a>
                    <a href="/search.html" class="nav-link active" data-i18n="nav.search">搜索</a>
                </div>
                <div class="nav-actions">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <select id="lang-select" class="lang-select">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                    <div id="auth-buttons" class="auth-buttons">
                        <a href="/login.html" class="btn btn-outline" data-i18n="nav.login">登录</a>
                        <a href="/register.html" class="btn btn-primary" data-i18n="nav.register">注册</a>
                    </div>
                </div>
            </div>
        </nav>

        <main>
            <div class="container">
                <div class="search-page">
                    <div class="search-header">
                        <h1 data-i18n="search.title">搜索照片</h1>
                        <p data-i18n="search.subtitle">按多个条件组合搜索航空摄影作品</p>
                    </div>

                    <div class="search-container">
                        <div class="search-filters">
                            <div class="filter-section">
                                <h3 data-i18n="search.filters">筛选条件</h3>

                                <div class="form-group">
                                    <label for="search-registration" data-i18n="search.byRegistration">按注册号搜索</label>
                                    <input type="text" id="search-registration" placeholder="例如：B-2032">
                                </div>

                                <div class="form-group">
                                    <label for="search-airline" data-i18n="search.byAirline">按航空公司搜索</label>
                                    <input type="text" id="search-airline" placeholder="例如：中国国际航空">
                                    <div class="autocomplete-results" id="search-airline-results"></div>
                                </div>

                                <div class="form-group">
                                    <label for="search-location" data-i18n="search.byLocation">按拍摄地点搜索</label>
                                    <input type="text" id="search-location" placeholder="例如：北京首都国际机场">
                                    <div class="autocomplete-results" id="search-location-results"></div>
                                </div>

                                <div class="form-group">
                                    <label for="search-aircraft" data-i18n="search.byAircraft">按机型搜索</label>
                                    <input type="text" id="search-aircraft" placeholder="例如：Boeing 777-300ER">
                                    <div class="autocomplete-results" id="search-aircraft-results"></div>
                                </div>

                                <div class="form-group">
                                    <label for="search-photographer" data-i18n="search.byPhotographer">按摄影师搜索</label>
                                    <input type="text" id="search-photographer" placeholder="输入摄影师用户名">
                                    <div class="autocomplete-results" id="search-photographer-results"></div>
                                </div>

                                <div class="form-group">
                                    <label for="search-date-from" data-i18n="search.dateRange">拍摄日期范围</label>
                                    <div class="date-range">
                                        <input type="date" id="search-date-from">
                                        <span>至</span>
                                        <input type="date" id="search-date-to">
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label data-i18n="search.byType">按图片类型筛选</label>
                                    <div class="checkbox-grid compact">
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="normal">
                                            <span data-i18n="upload.type.normal">普通涂装</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="special">
                                            <span data-i18n="upload.type.special">特殊涂装</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="artistic">
                                            <span data-i18n="upload.type.artistic">风格图</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="military">
                                            <span data-i18n="upload.type.military">军用机</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="night">
                                            <span data-i18n="upload.type.night">夜拍图片</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="airport">
                                            <span data-i18n="upload.type.airport">机场</span>
                                        </label>
                                    </div>
                                    <button type="button" id="show-more-types" class="btn-link" data-i18n="search.showMore">显示更多</button>
                                    <div class="checkbox-grid compact more-types hidden">
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="wing">
                                            <span data-i18n="upload.type.wing">机翼</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="cargo">
                                            <span data-i18n="upload.type.cargo">货机</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="cockpit">
                                            <span data-i18n="upload.type.cockpit">驾驶舱或客舱</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="meal">
                                            <span data-i18n="upload.type.meal">餐食</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="accident">
                                            <span data-i18n="upload.type.accident">事故</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="vehicle">
                                            <span data-i18n="upload.type.vehicle">地面车辆</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="rocket">
                                            <span data-i18n="upload.type.rocket">火箭或航天器</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="helicopter">
                                            <span data-i18n="upload.type.helicopter">直升机</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="parachute">
                                            <span data-i18n="upload.type.parachute">降落伞</span>
                                        </label>
                                        <label class="checkbox-label">
                                            <input type="checkbox" name="searchType" value="balloon">
                                            <span data-i18n="upload.type.balloon">浮空器</span>
                                        </label>
                                    </div>
                                </div>

                                <div class="filter-actions">
                                    <button type="button" id="reset-filters" class="btn btn-outline" data-i18n="search.reset">重置筛选</button>
                                    <button type="button" id="apply-filters" class="btn btn-primary" data-i18n="search.search">搜索</button>
                                </div>
                            </div>
                        </div>

                        <div class="search-results">
                            <div class="results-header">
                                <h2 data-i18n="search.results">搜索结果</h2>
                                <span class="results-count" id="results-count">找到 0 张照片</span>
                                <select id="sort-by" class="sort-select">
                                    <option value="latest" data-i18n="search.sort.latest">最新上传</option>
                                    <option value="popular" data-i18n="search.sort.popular">最受欢迎</option>
                                    <option value="date" data-i18n="search.sort.date">拍摄日期</option>
                                </select>
                            </div>
                            <div class="photo-grid" id="search-results-grid">
                                <div class="empty-state">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="11" cy="11" r="8"/>
                                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                    </svg>
                                    <p data-i18n="search.empty">输入搜索条件开始搜索照片</p>
                                </div>
                            </div>
                            <div class="pagination" id="pagination"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/search.js"></script>
</body>
</html>
