<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - EAC Photo</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/dark.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <a href="/" class="nav-logo">
                    <img id="nav-logo" src="https://r2.eacof.org/logo-light.png" alt="EAC Photo">
                </a>
                <div class="nav-menu">
                    <a href="/" class="nav-link" data-i18n="nav.home">首页</a>
                    <a href="/gallery.html" class="nav-link" data-i18n="nav.gallery">图库</a>
                    <a href="/upload.html" class="nav-link" data-i18n="nav.upload">上传</a>
                    <a href="/search.html" class="nav-link" data-i18n="nav.search">搜索</a>
                </div>
                <div class="nav-actions">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <select id="lang-select" class="lang-select">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                    <div id="user-menu" class="user-menu">
                        <div class="user-avatar">
                            <img src="https://r2.eacof.org/logo-light.png" alt="User">
                        </div>
                        <div class="user-dropdown">
                            <a href="/profile.html" data-i18n="nav.profile">个人主页</a>
                            <a href="/my-photos.html" data-i18n="nav.myPhotos">我的作品</a>
                            <a href="/settings.html" data-i18n="nav.settings">设置</a>
                            <button id="logout-btn" data-i18n="nav.logout">退出登录</button>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main>
            <div class="container">
                <div class="profile-page">
                    <div class="profile-header">
                        <div class="profile-cover"></div>
                        <div class="profile-info">
                            <div class="profile-avatar">
                                <img id="profile-avatar" src="https://r2.eacof.org/logo-light.png" alt="Avatar">
                            </div>
                            <div class="profile-details">
                                <h1 id="profile-username">Username</h1>
                                <p id="profile-bio">This is my bio</p>
                                <div class="profile-stats">
                                    <div class="stat-item">
                                        <span class="stat-value" id="stat-photos">0</span>
                                        <span class="stat-label" data-i18n="profile.photos">照片</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="stat-value" id="stat-likes">0</span>
                                        <span class="stat-label" data-i18n="profile.likes">获赞</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="stat-value" id="stat-views">0</span>
                                        <span class="stat-label" data-i18n="profile.views">浏览</span>
                                    </div>
                                    <div class="stat-item">
                                        <span class="stat-value" id="stat-joined">--</span>
                                        <span class="stat-label" data-i18n="profile.joined">加入于</span>
                                    </div>
                                </div>
                            </div>
                            <div class="profile-level">
                                <div class="level-badge" id="level-badge">
                                    <span class="level-icon">📷</span>
                                    <span class="level-text" id="level-text">新手摄影师</span>
                                </div>
                                <div class="level-progress">
                                    <div class="progress-bar">
                                        <div class="progress-fill" id="level-progress" style="width: 0%"></div>
                                    </div>
                                    <span class="progress-text" id="progress-text">0 / 100 XP</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="profile-content">
                        <div class="profile-tabs">
                            <button class="profile-tab active" data-tab="photos" data-i18n="profile.tab.photos">作品</button>
                            <button class="profile-tab" data-tab="favorites" data-i18n="profile.tab.favorites">收藏</button>
                            <button class="profile-tab" data-tab="achievements" data-i18n="profile.tab.achievements">成就</button>
                            <button class="profile-tab" data-tab="about" data-i18n="profile.tab.about">关于</button>
                        </div>

                        <div class="profile-tab-content">
                            <div class="tab-pane active" id="tab-photos">
                                <div class="photo-grid" id="profile-photos"></div>
                                <div class="pagination" id="profile-pagination"></div>
                            </div>
                            <div class="tab-pane" id="tab-favorites">
                                <div class="photo-grid" id="profile-favorites"></div>
                            </div>
                            <div class="tab-pane" id="tab-achievements">
                                <div class="achievements-grid" id="achievements-grid"></div>
                            </div>
                            <div class="tab-pane" id="tab-about">
                                <div class="about-section">
                                    <h3 data-i18n="profile.about">关于我</h3>
                                    <p id="about-text">Loading...</p>
                                    <h3 data-i18n="profile.equipment">常用设备</h3>
                                    <p id="equipment-text">Loading...</p>
                                    <h3 data-i18n="profile.locations">常去地点</h3>
                                    <p id="locations-text">Loading...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
