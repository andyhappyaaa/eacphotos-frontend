<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - EAC Photo</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/dark.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="nav-container">
                <a href="/" class="nav-logo">
                    <img id="nav-logo" src="https://r2.eacof.org/logo-light.png" alt="EAC Photo">
                </a>
                <div class="nav-menu">
                    <a href="/" class="nav-link" data-i18n="nav.home">首页</a>
                    <a href="/gallery.html" class="nav-link" data-i18n="nav.gallery">图库</a>
                    <a href="/upload.html" class="nav-link" data-i18n="nav.upload">上传</a>
                    <a href="/search.html" class="nav-link" data-i18n="nav.search">搜索</a>
                </div>
                <div class="nav-actions">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <select id="lang-select" class="lang-select">
                        <option value="zh">中文</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
        </nav>

        <main>
            <div class="auth-container">
                <div class="auth-box">
                    <div class="auth-header">
                        <img src="https://r2.eacof.org/logo-light.png" alt="EAC Photo">
                        <h1 data-i18n="login.title">登录</h1>
                        <p data-i18n="login.subtitle">欢迎回到EAC Photo</p>
                    </div>
                    <form id="login-form" class="auth-form">
                        <div class="form-group">
                            <label for="username" data-i18n="login.username">用户名或邮箱</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password" data-i18n="login.password">密码</label>
                            <input type="password" id="password" name="password" required>
                            <button type="button" class="toggle-password" data-target="password">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="remember-me" name="remember">
                                <span data-i18n="login.remember">记住我</span>
                            </label>
                        </div>
                        <div class="form-group">
                            <div class="turnstile-container" id="turnstile-container"></div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full" data-i18n="login.submit">登录</button>
                        <div class="form-footer">
                            <span data-i18n="login.noAccount">还没有账号？</span>
                            <a href="/register.html" data-i18n="login.register">立即注册</a>
                        </div>
                    </form>
                    <div id="2fa-modal" class="modal hidden">
                        <div class="modal-content">
                            <h2 data-i18n="2fa.title">两步验证</h2>
                            <p data-i18n="2fa.enterCode">请输入您的验证器应用中的6位验证码</p>
                            <div class="code-inputs">
                                <input type="text" maxlength="1" class="code-input" data-index="0">
                                <input type="text" maxlength="1" class="code-input" data-index="1">
                                <input type="text" maxlength="1" class="code-input" data-index="2">
                                <input type="text" maxlength="1" class="code-input" data-index="3">
                                <input type="text" maxlength="1" class="code-input" data-index="4">
                                <input type="text" maxlength="1" class="code-input" data-index="5">
                            </div>
                            <button id="verify-2fa" class="btn btn-primary" data-i18n="2fa.verify">验证</button>
                            <button id="cancel-2fa" class="btn btn-outline" data-i18n="2fa.cancel">取消</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/i18n.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
