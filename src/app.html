<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#2563eb" id="theme-color-meta" />
		<!-- Prevent FOUC: apply theme class before paint -->
		<script>
			(function(){var t=localStorage.getItem('eacphoto_theme');if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}document.documentElement.classList.add(t);document.documentElement.setAttribute('data-theme',t);var m=document.getElementById('theme-color-meta');if(m)m.content=t==='dark'?'#0f172a':'#2563eb';})();
		</script>
		<script src="/api/env"></script>
		<!-- Pre-render auth check: redirect before first paint -->
		<script>
			(function(){
				var EAC_SESSION="eacphoto_session";
				var EAC_REVIEWER="eacphoto_reviewer_session";
				var SESSION_DURATION=3*86400000; // 3 days
				function getSession(key){
					try{var s=JSON.parse(localStorage.getItem(key));return s&&s.token&&Date.now()<s.expiresAt?s:null;}catch(e){return null;}
				}
				var isLoggedIn=!!(getSession(EAC_SESSION)||getSession(EAC_REVIEWER));
				var path=window.location.pathname;
				var protectedPaths=["/upload","/dashboard","/profile","/review","/orgs"];
				var authPages=["/login","/register","/2fa"];
				var isProtected=protectedPaths.some(function(p){return path.startsWith(p);});
				var isAuthPage=authPages.some(function(p){return path===p;});
				if(isProtected&&!isLoggedIn){window.location.replace("/login");return;}
				if(isAuthPage&&isLoggedIn){window.location.replace("/dashboard");return;}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script src="https://gcore.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
