<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#2563eb" id="theme-color-meta" />
		<!-- Prevent FOUC: 原生跟随系统主题，不持久化手动选择 -->
		<script>
			(function(){var d=window.matchMedia('(prefers-color-scheme:dark)').matches;if(d)document.documentElement.classList.add('dark');document.documentElement.style.colorScheme=d?'dark':'light';var m=document.getElementById('theme-color-meta');if(m)m.content=d?'#0f172a':'#2563eb';})();
		</script>
		<script src="/api/env"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
			</body>
</html>
